extension=gd
upload_max_filesize=64M
post_max_size=64M
memory_limit=512M
max_execution_time=300

; Opcache Settings for Production
; Enable Opcache
opcache.enable=1
opcache.enable_cli=1
; 128MB memory for serving cached scripts
opcache.memory_consumption=128
; Store interned strings (class names, etc)
opcache.interned_strings_buffer=8
; Max files to cache (Laravel app usually has many files)
opcache.max_accelerated_files=10000
; Don't check for file updates in production (faster)
; Vercel rebuilds safely replace the container anyway
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1

; JIT Configuration (Turbo Mode)
; 100M buffer for compiled code
opcache.jit_buffer_size=100M
; Tracing JIT is generally the best balance for web apps
opcache.jit=tracing
